name: Report a listed integration
description: An entry is broken, misleading, or breaks the listing policy.
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Malware, credential theft or a vulnerability: do not file it here. Use **Report a security problem** on the previous page, which is private.
        A bug in the integration itself goes to its own issue tracker first.
  - type: input
    id: slug
    attributes:
      label: Entry
      description: The last part of the entry's URL, for example localwp in tablepro.app/integrations/localwp.
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Problem
      options:
        - It does not work with the current TablePro release
        - A link is broken or goes somewhere else
        - It reads TablePro's private files
        - It uses the TablePro name or icon in a confusing way
        - A disclosure on the page is wrong
        - It pretends to be someone else
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, with versions and links.
    validations:
      required: true
  - type: dropdown
    id: contacted
    attributes:
      label: Did you tell the author
      options:
        - Yes, with no reply after 7 days
        - Yes, recently
        - "No"
    validations:
      required: true

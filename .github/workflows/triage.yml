name: Triage

# Labels only. It never checks out or runs pull request code; it reads changed files through the API as data.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const maintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const labels = new Set();
            const slugs = new Map();
            for (const file of files) {
              const entry = /^integrations\/([a-z0-9-]{1,40})\/(.+)$/.exec(file.filename);
              if (entry) {
                if (entry[2] === 'integration.json') {
                  slugs.set(entry[1], file.status);
                  labels.add(file.status === 'added' ? 'new integration' : file.status === 'removed' ? 'removal' : 'update');
                } else {
                  labels.add('update');
                }
              } else if (file.filename.startsWith('curation/')) {
                labels.add('curation');
              } else {
                labels.add('tooling');
              }
            }
            async function readJson(repoOwner, repoName, ref, path) {
              try {
                const { data } = await github.rest.repos.getContent({ owner: repoOwner, repo: repoName, path, ref });
                return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch {
                return null;
              }
            }
            const tiers = ['official', 'partner', 'community'];
            let newName = null;
            for (const [slug, status] of slugs) {
              const path = `integrations/${slug}/integration.json`;
              const head = pr.head.repo && status !== 'removed'
                ? await readJson(pr.head.repo.owner.login, pr.head.repo.name, pr.head.sha, path) : null;
              const base = status === 'added' ? null : await readJson(owner, repo, pr.base.sha, path);
              if (head && tiers.includes(head.tier)) labels.add(`tier: ${head.tier}`);
              if (head && base && head.tier !== base.tier) labels.add('tier change');
              if (head && head.compliance) labels.add('grace period');
              if (status === 'added' && head && typeof head.name === 'string') newName = head.name.slice(0, 40);
              if (!maintainer && head) {
                const author = pr.user.login.toLowerCase();
                const publisher = String((head.publisher && head.publisher.github) || '').toLowerCase();
                const sourceRepo = head.source && head.source.type === 'github' ? String(head.source.repo || '') : '';
                const repoOwner = sourceRepo.split('/')[0].toLowerCase();
                let owns = author === publisher || (repoOwner !== '' && author === repoOwner);
                if (!owns && repoOwner) {
                  try {
                    await github.rest.orgs.checkPublicMembershipForUser({ org: repoOwner, username: pr.user.login });
                    owns = true;
                  } catch {}
                }
                if (!owns) labels.add('needs owner consent');
              }
            }
            if (!maintainer && slugs.size > 1) labels.add('multiple entries');
            if (labels.size) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [...labels] });
            }
            const conventional = /^(feat|fix|docs|chore|ci|build|refactor|test|revert)(\([a-z0-9-]+\))?!?: \S/;
            if (context.payload.action === 'opened' && slugs.size === 1 && newName && !conventional.test(pr.title)) {
              const [slug] = slugs.keys();
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title: `feat(${slug}): add ${newName}` });
            }
